[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pibench"
version = "0.1.0"
description = "Pi-Bench benchmark runner"
requires-python = ">=3.11"
dependencies = [
  "discord",
  "httpx",
  "pyyaml",
  "loguru",
  "rich",
]

[project.scripts]
pibench = "src.main:cli_main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
