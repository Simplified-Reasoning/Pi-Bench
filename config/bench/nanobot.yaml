version: 1

nanobot:
  trace_logs_dir: ~/.nanobot/trace_logs
  workspace_dir: ~/.nanobot/workspace
  copy_task_assets_to_workspace: true

run:
  mode: run
  output_dir: outputs
  log_level: INFO

  interaction:
    model_id: MiniMax-M2.5
    user_id: law_trainee
    user_mode: llm
    turn_timeout: 2400.0
    task_ids: []
    llm:
      model: gpt-5.4
      base_url: https://api.example.com/v1
      temperature: 0.0
      request_timeout: 360.0
      max_concurrency: 32
      max_retries: 4

  evaluation:
    model_id: MiniMax-M2.5
    user_id: law_trainee
    scoring: both # checklist proactiveness both
    history_config_path: config/bench/evaluation/trace_history.yaml
    llm:
      model: gpt-5.4
      base_url: https://api.example.com/v1
      temperature: 0.0
      request_timeout: 360.0
      max_concurrency: 128
      max_retries: 4
      reasoning_effort: high
