<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="420" viewBox="0 0 1120 420">
  <rect width="1120" height="420" fill="#f7f4ee"/>
  <text x="40" y="42" font-family="Helvetica, Arial, sans-serif" font-size="28" fill="#1f2a1f">前列腺癌主流治疗路径总览</text>
  <text x="40" y="72" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#4f5c4f">Use this table to map disease stage, treatment goal, and major drug classes before summarizing specific examples.</text>

  <rect x="40" y="110" width="1040" height="56" fill="#d7e0ee" stroke="#5c6f8f"/>
  <text x="70" y="145" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#24384d">阶段 / 情境</text>
  <text x="300" y="145" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#24384d">主要目标</text>
  <text x="520" y="145" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#24384d">常见路径</text>
  <text x="835" y="145" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#24384d">药物关注点</text>

  <rect x="40" y="166" width="1040" height="74" fill="#fffdf9" stroke="#b4b4b4"/>
  <text x="70" y="198" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#2a2a2a">局限性 / 局部进展期</text>
  <text x="300" y="198" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#2a2a2a">根治或长期控制</text>
  <text x="520" y="192" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#2a2a2a">手术、放疗、</text>
  <text x="520" y="214" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#2a2a2a">高风险时联合 ADT</text>
  <text x="835" y="192" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#2a2a2a">药物多为辅助角色，</text>
  <text x="835" y="214" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#2a2a2a">不应和晚期系统治疗混讲</text>

  <rect x="40" y="240" width="1040" height="78" fill="#f9fbff" stroke="#b4b4b4"/>
  <text x="70" y="274" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#2a2a2a">转移性激素敏感期</text>
  <text x="300" y="274" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#2a2a2a">系统控制、延缓进展</text>
  <text x="520" y="266" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#2a2a2a">ADT 作为骨架，</text>
  <text x="520" y="288" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#2a2a2a">可按临床情况叠加 ARPI 或化疗</text>
  <text x="835" y="266" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#2a2a2a">要区分骨架治疗与</text>
  <text x="835" y="288" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#2a2a2a">强化治疗</text>

  <rect x="40" y="318" width="1040" height="78" fill="#fffdf9" stroke="#b4b4b4"/>
  <text x="70" y="352" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#2a2a2a">去势抵抗期（CRPC / mCRPC）</text>
  <text x="300" y="352" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#2a2a2a">进一步延缓进展、症状控制</text>
  <text x="520" y="344" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#2a2a2a">继续去势背景下</text>
  <text x="520" y="366" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#2a2a2a">选择 ARPI、化疗、核素、靶向</text>
  <text x="835" y="344" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#2a2a2a">要结合既往用药、</text>
  <text x="835" y="366" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#2a2a2a">转移部位和分子特征；部分方案仅用于特定情境</text>
</svg>
