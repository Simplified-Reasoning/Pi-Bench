schema_version: v2
user_id: pharmacist
role: |
  # pharmacist
  - Identity & Background: The user is a 24-year-old second-year master's student in pharmaceutics at a medical-pharmaceutical university in East China. Her main research focus is topical formulation development, drug delivery, and efficacy/safety evaluation. Her daily work spans literature reading, formulation design, cell experiments, analytical methods, and lab-meeting preparation, so she frequently switches among pharmaceutics, oncology pharmacology, clinical studies, patents, and experimental techniques. She has a solid wet-lab foundation and is comfortable with cell culture, CCK-8, qPCR, HPLC, basic formulation preparation, and routine data handling, but she still wants dense agent support for complex troubleshooting, cross-disciplinary synthesis, clinical-study interpretation, and building systematic research plans from scratch. Her long-term goal is to build a closed-loop research workflow around a topical formulation project, covering literature and product survey, formulation design, experimental validation, troubleshooting, and thesis-ready output, and to turn that workflow into reusable templates for future work.

  - Current Life Log & Active Threads: Over the past two weeks, she has mainly been advancing five threads. First, she is preparing lab-meeting materials and needs to quickly organize the research landscape of disease areas such as triple-negative breast cancer, while also being able to explain individual papers, figures, and validation logic clearly. Second, she is moving a formulation project forward around eczema or other skin-related indications, starting from marketed-product survey, comparable routes, API property review, formulation design, screening matrices, and evaluation metrics. Third, she is handling experiment and analysis support questions around qPCR, CCK-8, pipetting error, chromatographic peak shape, and sample stability, and she wants those scattered problems turned into actionable troubleshooting sequences. Fourth, she is broadening her view of drug-design directions, such as understanding PROTAC, organizing linker innovation directions, and distinguishing which ideas are actually suitable for execution. Fifth, she wants to turn reading to-dos, procurement to-dos, and experiment to-dos into directly executable lists rather than repeatedly context-switching in her head.

  - Interaction Preferences: Use English by default. Common domain terms such as PROTAC, linker, Ct, Cmax, housekeeping gene, shoulder peak, and release profile can be kept directly. She prefers conclusion first and does not like long warm-up paragraphs. If information is sufficient, she wants a clear answer first and then structured explanation. If information is obviously insufficient, she would rather see the key missing piece identified first than have the agent silently assume details. For literature, clinical studies, drug information, patents, and experiment-parameter questions, she cares about traceability and wants authoritative sources, recommended databases, or good search keywords. For uncertain content, she expects an explicit separation among known facts, missing information, and experience-based judgment or general framework.

  - Workflow Preferences: Her usual workflow is confirm the object and constraints -> search comparable information -> summarize variables and risk points -> design a minimum executable plan -> troubleshoot or optimize based on the results. For lab meetings and project discussions, she prefers outputs that can be pasted directly into PPT, Notion, or a report draft, such as tables, bullets, and checklists. For experiment workflows, she prefers stepwise answers with controls, key variables, and common pitfalls. For troubleshooting, she prefers the structure possible cause -> how to verify -> what to try first -> risk reminder instead of abstract theory only. For open-ended questions, she usually finds it more useful if the agent also adds one recommended next step.

  - Skill & Tool Preferences: She often uses PubMed, Web of Science, Google Scholar, ClinicalTrials, NMPA-related resources, Yaozhi, and common patent databases for information retrieval. For data handling she mainly uses Excel, GraphPad Prism, and Origin. She is already fairly comfortable with database search, basic experimental workflows, and routine instrument readouts, but she still relies on an agent for dense help on clinical-study interpretation, complex formulation optimization, interdisciplinary drug-design questions, and systematic troubleshooting. When recommending information sources, the agent should prioritize authoritative databases or primary sources rather than generic blogs.

  - Decision & Tradeoff Preferences: She cares most about balancing scientific rigor, experimental executability, and time efficiency. Exploratory suggestions are acceptable only when the agent clearly marks which parts depend on the specific API, formulation, experiment, or full paper. For topics that touch patient treatment, she wants only general medical-information synthesis and does not want pseudo-personalized treatment advice. She is sensitive to experimental safety, contamination, sample stability, dose interpretation, and over-extrapolation from limited data, and she expects the agent to proactively flag red lines and boundaries. Her tolerance for flashy but impractical suggestions is low; she strongly prefers a reliable starting version before expanding into more ambitious routes.

  - Output Preferences: She most often needs three types of outputs. First, comparison-style organization such as tables for papers, products, patents, or drug classes. Second, stepwise plans such as experiment workflows, formulation-screening paths, concentration-gradient design, or learning plans. Third, troubleshooting frameworks such as the most likely causes + verification actions + priority + correction direction. If an answer is longer than a paragraph, she wants the structure to be obvious so it can be scanned quickly. For literature and information synthesis, source paths should be retained. For experiment and formulation questions, executable actions, missing information, and applicability boundaries should be separated.

  - Risk & Compliance Preferences: She values research integrity, complete records, and basic compliance. She does not accept fabricated data, fake literature, unsupported citations, or general medical information being phrased as individualized medical advice. For clinical treatment, animal experiments, cell culture, or cryopreservation topics, she expects neutral and concise reminders about the need to check guidelines, ethics, SOPs, or supervisor input when appropriate. If a task depends on concrete materials and those materials are missing, she would rather have the agent explicitly state what cannot be concluded reliably than force a complete-looking answer.

preferences:
  language: en
  verbosity: high
long_term_goals:
  - Complete a graduate research project around topical formulation development and evaluation with reproducible experimental pathways and thesis-level results.
  - Build a stable workflow for efficiently extracting information from literature, patents, marketed products, and clinical studies and converting that information into experiment design.
  - Strengthen the ability to connect API properties, formulation design, cell experiments, analytical methods, and troubleshooting into a closed-loop research process.
