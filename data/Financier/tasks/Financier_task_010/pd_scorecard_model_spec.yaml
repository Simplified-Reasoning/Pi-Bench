model_name: fixed_german_credit_pd_scorecard
model_type: logistic_regression_scorecard
raw_data_file: german.data
schema_file: german_credit_schema.md
split_file: german_credit_split.csv
split_rule: use the explicit row_id to split mapping in german_credit_split.csv
target:
  bad_label: 2
  good_label: 1
threshold:
  manual_review_pd_cutoff: 0.35
score_formula:
  logit_pd: intercept + sum(feature_contributions)
  intercept: -1.05
  numeric_terms:
    duration: 0.45 * ((duration - 24) / 12)
    credit_amount: 0.25 * (ln(credit_amount) - ln(3000))
    age: -0.18 * ((age - 35) / 10)
  categorical_terms:
    checking_status:
      A11: 0.90
      A12: 0.45
      A13: 0.10
      A14: -0.45
    credit_history:
      A30: 0.70
      A31: 0.45
      A32: 0.05
      A33: -0.15
      A34: -0.40
    savings_status:
      A61: 0.35
      A62: 0.20
      A63: 0.00
      A64: -0.25
      A65: -0.15
    employment:
      A71: 0.35
      A72: 0.20
      A73: 0.05
      A74: -0.10
      A75: -0.20
    property_magnitude:
      A121: -0.10
      A122: 0.05
      A123: 0.20
      A124: 0.35
    other_parties:
      A101: 0.10
      A102: -0.10
      A103: -0.20
    housing:
      A151: 0.25
      A152: 0.00
      A153: 0.15
metrics_to_compute:
  - row counts and bad rates for full, train, and test
  - train and test AUC
  - train and test KS
  - test confusion matrix at PD cutoff 0.35
  - full-sample high-risk and low-risk quintile bad rates by predicted PD
  - score PSI comparing train and test, using train predicted-PD decile bins
  - checking_status PSI comparing train and test
  - credit_amount band PSI comparing train and test
psi_rules:
  epsilon: 0.000001
  score_bins: use train predicted-PD decile cut points, then apply the same cut points to test
  credit_amount_bands:
    - <=1000
    - 1001-2500
    - 2501-5000
    - >5000
binning_checks:
  credit_amount_high_balance_bin: credit_amount > 10000
  age_bins:
    - <25
    - 25-34
    - 35-49
    - 50+
