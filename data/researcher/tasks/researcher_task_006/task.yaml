schema_version: v2
task_id: researcher_task_006
user_id: researcher
environment_id: env_researcher

title: "ICLR 2026 Accepted Papers: Survey on Think-with-Image Related Topics"
description: "For a small 'think-with-image' tool-use agent project starting from scratch, use the list of ICLR 2026 accepted papers to filter and organize the most relevant works on image-driven reasoning, visual chain-of-thought (visual CoT), and multimodal agent tool use, producing outputs that can directly support subsequent topic focusing."

task_type: long_term

trigger:
  type: user

intent:
  initial_input: "I wrote a local file at paper_list.txt that contains some accepted ICLR 2026 papers. Please organize several papers related to my research theme for me."
  hidden_intent:
    - content: "Primarily recommend think-with-image papers."

    - content: "Recommend around 5 papers."

    - content: "Provide a brief introduction and key technical points for each paper."

    - content: "Provide the OpenReview link for each paper."

    - content: "Provide the GitHub link for each paper; if a paper has no open-source GitHub repository, explicitly state that."

    - content: "For every paper, state whether it is suitable to follow and how to follow it."

objectives:
  checklist:
    - criterion: "Include the paper Thyme: Think Beyond Images."

    - criterion: "Mention that Thyme uses SFT and reinforcement learning (RL) to equip multimodal large models with the ability to autonomously generate and execute Python code, leveraging an innovative GRPO-ATS algorithm."

    - criterion: "Write the OpenReview link for Thyme: Think Beyond Images as https://openreview.net/forum?id=gCWLkqK45O"

    - criterion: "Write the GitHub link for Thyme: Think Beyond Images as https://github.com/yfzhang114/Thyme"

    - criterion: "Include the paper VTool-R1: VLMs Learn to Think with Images via Reinforcement Learning on Multimodal Tool Use"

    - criterion: "Mention that VTool-R1 is the first framework using reinforcement fine-tuning (RFT) to train vision-language models (VLMs) to generate multimodal chains of thought, enabling models to interleave intermediate image steps generated by Python vision tools during reasoning (paraphrase is acceptable)."

    - criterion: "Write the OpenReview link for VTool-R1: VLMs Learn to Think with Images via Reinforcement Learning on Multimodal Tool Use as https://openreview.net/forum?id=Idst6X6gmy"

    - criterion: "Write the GitHub link for VTool-R1: VLMs Learn to Think with Images via Reinforcement Learning on Multimodal Tool Use as https://github.com/VTOOL-R1/vtool-r1"

    - criterion: "Include the paper DeepEyes: Incentivizing \"Thinking with Images\" via Reinforcement Learning"

    - criterion: "Mention that the core technical point of DeepEyes is using end-to-end reinforcement learning to incentivize vision-language models to autonomously invoke a built-in local image zoom-in tool as needed during reasoning, enabling deep interaction optimization between active perception and textual logic within a single reasoning trajectory (paraphrase is acceptable)."

    - criterion: "Write the OpenReview link for DeepEyes as https://openreview.net/forum?id=xUyMXkI958"

    - criterion: "Write the GitHub link for DeepEyes as https://github.com/Visual-Agent/DeepEyes"

    - criterion: "Include the paper MEDICAL THINKING WITH MULTIPLE IMAGES"

    - criterion: "Mention that MEDICAL THINKING WITH MULTIPLE IMAGES provides large-scale clinical cases with an average of 6.68 images, aiming to evaluate and train a model's ability to integrate cross-image evidence and perform step-level reasoning in complex diagnostic processes (paraphrase is acceptable)."

    - criterion: "Write the OpenReview link for MEDICAL THINKING WITH MULTIPLE IMAGES as https://openreview.net/forum?id=h2p5eOFpcF"

    - criterion: "Write the GitHub link for MEDICAL THINKING WITH MULTIPLE IMAGES as https://openreview.net/forum?id=h2p5eOFpcF"

    - criterion: "Output should include the paper VGR: VISUAL GROUNDED REASONING"

    - criterion: "Mention that the key technical contribution of VGR is a visual memory replay mechanism, which dynamically detects and replays visual details of key regions during reasoning; combined with its constructed VGR-SFT hybrid alignment dataset, this enables models to proactively retrieve local image information to assist complex multimodal logical reasoning."

    - criterion: "Write the OpenReview link for VGR: VISUAL GROUNDED REASONING as https://openreview.net/forum?id=kDhAiaGzrn"

    - criterion: "State that VGR: VISUAL GROUNDED REASONING currently has no GitHub link"

    - criterion: "Whether Thyme is suitable to follow, and how to follow it"

    - criterion: "Whether VTool-R1 is suitable to follow, and how to follow it"

    - criterion: "Whether DeepEyes is suitable to follow, and how to follow it"

    - criterion: "Whether MEDICAL THINKING WITH MULTIPLE IMAGES is suitable to follow, and how to follow it"

    - criterion: "Whether VGR: VISUAL GROUNDED REASONING is suitable to follow, and how to follow it"

metadata:
  difficulty: hard
