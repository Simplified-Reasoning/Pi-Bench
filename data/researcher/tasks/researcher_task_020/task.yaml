  hidden_intent:
    - content: "Give list OpenClaw-related papers from this recommendation trigger."

    - content: "Give add a short introduction and key technical points for each OpenClaw-related paper."

    - content: "Give include arXiv links for the OpenClaw-related papers."

    - content: "Give GitHub links for the OpenClaw-related papers."

    - content: "Give the research institution and author for each OpenClaw-related paper."

objectives:

  checklist:
    - criterion: "Recommends the paper A Trajectory-Based Safety Audit of Clawdbot."

    - criterion: "Recommends the paper Humans welcome to observe: A First Look at Moltbook."

    - criterion: "Recommends the paper MetaClaw: Just Talk - An Agent That Meta-Learns and Evolves in the Wild."

    - criterion: "Recommends the paper OpenClaw-RL: Train Any Agent Simply by Talking."

    - criterion: "States that the core idea of A Trajectory-Based Safety Audit of Clawdbot is a trajectory-based, six-dimensional safety-audit framework revealing structural security risks for tool agents like Clawdbot under ambiguous intent and adversarial instructions, stemming from permission sprawl/amplification (paraphrase acceptable)."

    - criterion: "States that Humans welcome to observe: presents a large-scale empirical study of the first agent-native social network Moltbook, using topic categorization and toxicity metrics to analyze agent behavior evolution, group dynamics, and systemic risks in a native social setting (paraphrase acceptable)."

    - criterion: "States that MetaClaw: Just Talk - An Agent That Meta-Learns and Evolves in the Wild proposes MetaClaw, a dual-loop framework combining fast skill evolution from failure trajectories with asynchronous policy optimization using users' idle time, enabling non-stop continual learning under real deployment (paraphrase acceptable)."

    - criterion: "States that OpenClaw-RL: Train Any Agent Simply by Talking develops a general asynchronous RL framework turning next-state signals from agent interaction into an online learning source, combining process reward (PRM) and hindsight-guided distillation (OPD) to improve policy performance (paraphrase acceptable)."

    - criterion: "Gives the GitHub link for A Trajectory-Based Safety Audit of Clawdbot as https://github.com/tychenn/clawdbot_report."

    - criterion: "Gives the GitHub link for Humans welcome to observe: A First Look at Moltbook as https://moltbookobserve.github.io/."

    - criterion: "Gives the GitHub link for MetaClaw: Just Talk - An Agent That Meta-Learns and Evolves in the Wild as https://github.com/aiming-lab/MetaClaw."

    - criterion: "Gives the GitHub link for OpenClaw-RL: Train Any Agent Simply by Talking as https://github.com/Gen-Verse/OpenClaw-RL."

    - criterion: "Gives the arXiv link for Humans welcome to observe: A First Look at the Agent Social Network Moltbook as https://arxiv.org/abs/2602.10127."

    - criterion: "Gives the arXiv link for A Trajectory-Based Safety Audit of Clawdbot as https://arxiv.org/abs/2602.14364."

    - criterion: "Gives the arXiv link for MetaClaw: Just Talk - An Agent That Meta-Learns and Evolves in the Wild as https://arxiv.org/abs/2603.17187."

    - criterion: "Gives the arXiv link for OpenClaw-RL: Train Any Agent Simply by Talking as https://arxiv.org/abs/2603.10165."

    - criterion: "OpenClaw-RL: Train Any Agent Simply by Talking is authored by Yinjie Wang, Xuyang Chen, Xiaolong Jin, Mengdi Wang, and Ling Yang. The affiliation is Princeton University."

    - criterion: "Humans Welcome to Observe: A First Look at the Agent Social Network Moltbook is authored by Yukun Jiang, Yage Zhang, Xinyue Shen, Michael Backes, and Yang Zhang. The affiliation is CISPA Helmholtz Center for Information Security."

    - criterion: "A Trajectory-Based Safety Audit of Clawdbot is authored by Tianyu Chen, Dongrui Liu, Xia Hu, Jingyi Yu, Wenjie Wang. The affiliations are ShanghaiTech University, Shanghai, China, and Shanghai Artificial Intelligence Laboratory, Shanghai, China."

    - criterion: "MetaClaw: Just Talk - An Agent That Meta-Learns and Evolves in the Wild is authored by Peng Xia1, Jianwen Chen1, Xinyu Yang2, Haoqin Tu3, Jiaqi Liu1, Kaiwen Xiong1, Siwei Han, Shi Qiu, Haonian Ji, Yuyin Zhou, Zeyu Zheng, Cihang Xie, and Huaxiu Yao. The affiliations are UNC-Chapel Hill, Carnegie Mellon University, UC Santa Cruz, and UC Berkeley."

