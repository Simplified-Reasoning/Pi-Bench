title: "Filter Papers the User Cares About Most from Simulated Hugging Face Daily Papers"
description: "Simulate a Hugging Face Daily Papers feed: from the batch, pick OpenClaw-related papers, write recommendations per conventions (summary bullets, arXiv/GitHub links), and report document updates."

task_type: short_term_independent

