schema_version: v2
user_id: researcher
role: |
  # researcher

  - Identity & Background: The user is a 26-year-old male currently in the third year of a PhD in Artificial Intelligence at Fudan University's Jiangwan Campus, and expects to complete the degree in about one to one and a half years. He usually lives in a first-tier or emerging first-tier city near the university, in a shared apartment about a 12-minute walk from campus, with a fellow PhD student from the same lab, and has no partner or children. His native language is Chinese; he has strong English reading and writing skills, regularly reads arXiv papers, top-conference publications, and open-source project docs, and can write English papers and technical reports fluently. He mainly uses spoken English for lab meetings and conference discussions. Both his bachelor's and master's degrees are in computer-related fields. He began working on multimodal learning and vision-language models during his master's study, and his PhD research is more focused on multimodal large-model understanding and reasoning under the "think-with-image" paradigm: using images as the primary context and performing chain-of-thought reasoning and decision-making on top of the image through stepwise calls to external tools such as vision and retrieval. His long-term goal is to complete, before graduation, a tool-use agent project centered on "think-with-image" that can continuously "observe-think-search-compute" around images, solve a clearly bounded class of visual reasoning and task-planning problems within a limited toolset and controlled environment, and be reproducible, extensible, and demo-ready, so it can serve as one of the core contributions of his dissertation. His income mainly comes from a university research assistant stipend and a small amount of project subsidies, with no stable side business. He is strongly motivated to produce clearly differentiated results under limited compute and data. He is accustomed to using agents to assist with literature review, code framework selection, experiment design, ablation analysis organization, paper/report polishing, conference and travel planning, and converting scattered ideas into executable milestone and task lists. He is highly sensitive to repetitive experiments and documentation overhead, and hopes to use agents to reduce context-switching costs from idea to implementation and from experimentation to writing, so he can focus on problem definition, method design, and result interpretation.

  - Current Life Log & Active Threads: Over the past two weeks, he has been advancing multiple main threads related to PhD research and daily life. First, the "c" project has not formally started yet and is still in the stage of planning from scratch, narrowing to a small-scope topic, and defining a route. The initial idea is to begin with relatively simple and closed single-image reasoning scenarios (for example, given one image and one question, allowing calls to visual tools such as captioning, OCR, detection, and retrieval, then reasoning step by step around the image), rather than starting directly with a general web environment or an all-in-one multi-task setting. Under this think-with-image setup, two questions need to be clarified first: (1) how to abstract and register visual tools (e.g., captioning, region description, detection, external retrieval) as callable tools; and (2) what paradigm is most suitable for the agent's internal image-grounded reasoning process (simple function calling, ReAct style, planner-executor, or program generation). Second, a conference paper on multimodal reasoning is in the rebuttal phase. Reviewers requested additional comparison experiments against SOTA methods under identical settings. He needs an agent to help organize writing points for the "additional experiments" section of the rebuttal and list the extra configurations to run plus expected conclusions, with a deadline by the end of this week. Third, his advisor wants to see a progress plan or preliminary roadmap for the "think-with-image" tool-use agent at next month's group meeting (e.g., what image task category to demo first, which visual tools and text models are needed, and what the rough timeline looks like). He needs agent support to structure milestones and a minimum viable plan from zero to one. Fourth, there are two academic conferences this month (online/offline mix), one domestic and one overseas, both requiring registration and itinerary planning. With a limited budget, he hopes the agent can provide a visa-material checklist (if traveling abroad), rough budget ranges for flights and hotels, and a concise statement of "reasons for attending and expected gains" for reporting to his advisor.

  - Interaction Preferences: Use Chinese by default. In technical discussions, English terms (e.g., tool use, function calling, multimodal, benchmark) can be kept directly and do not need line-by-line translation. Preferred tone is direct with minimal small talk, without excessive encouragement or emotional framing. If conclusions are clear, he prefers seeing conclusions first, followed by reasoning. He expects high information density: when asking on a phone or in fragmented time (e.g., queues, commuting), he wants "conclusion first + no more than 5-6 key points + short copy-ready sentences/lists," with total length within about 300-400 Chinese characters; when asking at a computer (lab desk or dorm), he accepts 800-2000 characters of structured content including comparison tables, assumption notes, and source citations. If key gaps exist (e.g., dataset, evaluation metrics, or environment constraints not specified), he prefers the agent to ask up to three high-value clarification questions first, rather than making long speculative assumptions. Fault tolerance is medium: if the agent makes factual errors (e.g., misreading paper conclusions, incorrect API usage, inconsistent experiment settings), he will point them out directly and request correction or rewrite, without needing apology-heavy preambles. For unverified inferences, he expects explicit labels such as "assumption" or "to be validated." On academic integrity, data compliance, and open-source licenses for code/models, he expects proactive reminders about red lines. For purely execution-oriented tasks (e.g., "translate this into English," "generate a config in a given format"), direct execution is enough without extra expansion. When papers, datasets, or APIs are involved, he wants sources (paper title, link, or time reference) for traceability. He does not proactively engage political or sensitive social topics; if ethics or social impact is involved, wording should remain neutral and citable.

  - Workflow Preferences: His typical workflow is "define goals and constraints -> research/compare options -> choose a solution -> implement in phases -> validate with experiments -> document and review." When time is sufficient, he collects multiple related papers and implementations first, then abstracts common patterns. Under tight schedules (e.g., before deadlines or group meetings), he follows a "minimum viable version first" strategy: get the main pipeline running before iterating details, avoiding perfectionist delays. He has high acceptance for templates and checklists: he is willing to standardize literature reading, experiment logs, code/config versioning, and conference/travel procedures into fixed templates or checklists. However, core method design, key experimental conclusions, and the paper's central claims must remain under his own control rather than fully delegated to auto-generation. He conducts a research progress review weekly or biweekly in Notion or local docs, covering completed experiments, key papers read, bottlenecks, and next steps. If an agent supports the review, output should be directly pasteable bullet-point summaries plus recommended next actions. He does not keep daily logs unless experiments repeatedly fail or produce abnormal results, in which case he starts focused troubleshooting. He has strong reproducibility requirements and expects environment/version notes when code or configurations are provided, for future replication.

  - Skill & Tool Preferences: His primary devices are a personal laptop (Linux or macOS, used for most work time) and a lab workstation (remote SSH). The phone is mainly for messages, lightweight search, and scheduling. Development is Python-first; he is familiar with PyTorch, Transformers, and common multimodal/agent-related libraries. He can read and modify C++/CUDA code but does not use it as his daily development mainstay. Writing and notes are done in Notion, Zotero, and Markdown. Code and experiment configurations are managed with Git, with a preference for clear project structure and README documentation. File naming and directory organization follow "project/task_date_version-or-note," such as "tool_agent_design_20260301" and "rebuttal_exp_supp_v2." He prefers plain text, tables, and code blocks, and dislikes long voice transcriptions. For formulas and algorithm descriptions, he prefers LaTeX or clear symbolic notation. Common information sources include arXiv, top-conference websites, GitHub, Hugging Face, Zhihu, and a small number of technical blogs. For English materials, he prefers 1-2 lines of Chinese summary for key conclusions. He is comfortable with command lines, scripts, and API calls, and expects runnable or minimally editable commands/code snippets from the agent. His ecosystem preference is open-source first: prioritize open-source models, datasets, and self-deployable toolchains. Commercial APIs (e.g., OpenAI, Claude) may be used in research/comparison, but long-term systems should be as offline-capable or replaceable as possible. He is moderately to highly familiar with common tools (Docker, conda, wandb, tensorboard) and can configure/troubleshoot via documentation. If a new tool is recommended, he expects a brief note on suitable scenarios, learning cost, and alternatives.

  - Decision & Tradeoff Preferences: His priority order for tradeoffs is "reproducibility and controllability > result quality and novelty > efficiency and time > cost and compute > technical novelty." If a solution can significantly reduce long-term maintenance and replication cost (e.g., unified interfaces, containerization), he tends to accept it even if setup takes an extra 1-2 days. Conversely, if a solution depends on uncontrollable external services or hard-to-reproduce private data, he adopts it cautiously. Risk tolerance is medium: zero tolerance for academic misconduct, data non-compliance, and code copyright violations; moderate tolerance for failed experiments, non-working methods, and schedule slips as normal research trial-and-error. For new tools/frameworks, he follows "small-scale validation before expansion": test in side projects or branches first, then migrate to the main pipeline only if stability and efficiency meet expectations. If hard-to-debug dependency conflicts or irreproducible results appear, he rolls back to known stable solutions. When aligning with advisors or collaborators, he insists on clear communication about problem framing, contribution boundaries, and publication plans; for implementation details and tool selection, he accepts suggestions and compromises. He has explicit requirements for publishability and demoability: the long-term tool-use agent project should provide both clear methodological contribution and a runnable demo to support papers and dissertation defense.

  - Output Preferences: For research and selection questions, he prefers "comparison table + pros/cons + explicit reasons for recommended and not-recommended options + sources and timestamps." For coding/implementation tasks, he expects "runnable or easily editable code/configuration + dependency and run instructions + key assumptions and uncovered boundaries." For writing/reporting tasks, he needs "structured outline or bullet points + directly pasteable paragraphs/lists," with clear tone distinctions between "paper/report" and "group meeting/email." If content exceeds 800 Chinese characters, he wants a 3-5 line conclusion summary at the beginning. Numbers and metrics should include units, data sources, and time scope; formulas/algorithms involving symbols should include brief definitions. Avoid unnecessary emojis. Keep paragraphs compact for easy copy-paste into Notion, Overleaf, or email. For planning and task decomposition outputs, he wants a clear mapping of "stage + deliverables + dependencies + suggested timeline" for scheduling and self-checking.

  - Personal / Contextual Preferences:
    - Consumption & Resource Usage: Overall spending level is low-to-mid, with income mainly from RA stipends. For major expenses (e.g., expensive cloud compute, monthly commercial API plans, high-end devices), he weighs cost-effectiveness and necessity. Compute resources mainly come from lab and university infrastructure. Personal spending on cloud/API usage is kept within an acceptable range (e.g., a few hundred RMB per month), and he expects agents to indicate the approximate compute/API cost level when recommending solutions. He is willing to pay for productivity subscriptions (e.g., Notion, Zotero, cloud storage), but evaluates usage frequency and alternatives, with a psychological cap on annual subscription totals. Reimbursable conference registration and travel follow university policy; out-of-pocket expenses tend toward economical options. He is more willing to spend on items that significantly save time or reduce risk (e.g., stable VPN, backup drives, booking conference tickets early).
    - Time Sensitivity & Tradeoffs: He is highly sensitive to deadlines, group meetings, and advisor-agreed milestones. He is willing to invest in tools and information retrieval to save time, but not at the expense of experimental rigor and reproducibility. If spending a bit more money or setup effort can save substantial time, he prefers the time-saving option. Conversely, if an option is merely trendy but adds uncertainty, he will not spend extra time to follow the trend. When urgent tasks are inserted, he prioritizes already committed deliverables before accepting new work. Important files and code are backed up both locally and in the cloud; he would rather add an extra backup step than risk data loss.
    - Travel & Mobility: He often travels for academic conferences, collaboration discussions, or dataset collection, mainly to first- and second-tier domestic cities, with occasional international trips. For domestic travel, high-speed rail is preferred and tickets are booked 3-7 days in advance. Between direct routes and transfers, he prefers direct routes to reduce delays and fatigue. Hotel preferences are university negotiated rates or economical chains, with clear requirements for proximity to venue/collaborators, walkability or metro access, and stable network quality. For international travel, he depends heavily on visa/material checklists and expects agent outputs in checkable list form with timeline checkpoints. He prefers to avoid very early morning or late-night travel to protect next-day productivity. He usually carries a laptop, charger, USB drive or portable hard disk, and noise-canceling headphones. If conferences switch online, he prioritizes quiet environments and stable networks. For online meetings within 2-3 hours of time-zone difference, he usually does not adjust his routine specifically.
    - Scheduling Flexibility: He tries not to change committed deadlines or group-meeting times. If rescheduling is required due to force majeure, he can accept one or two adjustments but expects early notice and alternative times. Tolerance for waiting is limited. For agent/system response latency, he prefers progress indicators or chunked loading rather than long silence. Ad-hoc tasks may be inserted by priority, but he dislikes frequent interruptions during core experiment or writing blocks.
    - Physical & Environmental Comfort: He is sensitive to noise and temperature in both lab and dorm, and needs either a focus-friendly environment or noise-canceling headphones. Preferred room temperature is 22-26 C. For walking distance, under 12 minutes from residence to lab is acceptable; over 20 minutes leads him to consider biking or public transit. During travel, he prefers hotels within a 15-minute walk to the venue or within 2-3 metro stops. He maintains regular exercise each week; after multiple days without exercise, he feels reduced energy.
    - Body & Diet Preferences: Height is about 175 cm, weight about 68 kg, and body-fat ratio around 17%. He is currently in a muscle-gain phase and wants sufficient nutrition without overly greasy food, with particular attention to daily protein, carbohydrates, dietary fiber, and healthy fat intake balance. He prefers cafeteria/takeout combinations that are "light but protein-adequate" rather than heavy-oil, high-salt junk food.
    - Routine & Energy Rhythm: High-efficiency periods are usually 09:30-12:00 and 20:00-23:00; 14:00-16:00 is often lower-efficiency time, used for email, note organization, or simple experiments. He avoids making major method decisions or submitting papers late at night. Near submission deadlines, short-term late nights are acceptable, but he tries to keep key decisions and submissions in clear-headed periods. After multiple days of high-intensity work, he needs recovery and reserves buffer days.
    - Familiarity & Openness to New Tools: In toolchains/workflows, he prefers stability first: familiar editors, terminals, Notion, Zotero, and Git are default choices. New tools are tested in small scope before deciding on full migration. He is open to trying new things, but expects agents to state learning cost and alternatives when recommending new tools. In research methods/model selection, he is relatively open to new papers/frameworks, provided replication paths are clear and compatible with existing code.
    - Stability & Predictability: He strongly requires reproducible results and predictable processes. Important experiments/code retain environment descriptions and version metadata. For trips and conferences, he checks routes, weather, and fallback plans in advance. If a step depends on external services (e.g., APIs, cloud training), he considers downgrade or local alternatives to avoid single points of failure. He expects recommendations to include assumptions and fallbacks when assumptions are not met, rather than a single ideal path.
    - Collaboration & Social Context: Research work is mainly "independent execution + regular alignment with advisor/labmates," with occasional cross-group/cross-university collaboration. Communication with advisor, labmates, and collaborators is mainly via email and instant messaging. He prefers agenda/key-point lists before meetings to avoid unfocused discussions. Personal life and social circles are relatively independent, with research discussions mostly within academic circles. For multi-party collaboration/alignment meetings, he prepares materials in advance and expects the agent to distinguish between versions for personal decision-making and versions for external alignment.
    - Privacy & Information Exposure: He is privacy-sensitive and does not want unnecessary exposure of home address, ID number, income, or financial details. He is cautious about third-party tools requesting account/data permissions and prefers read-only or least-privilege access. He proactively verifies data-cross-border and training-data compliance issues. Before formal publication or open-source release, he does not want papers/code to be distributed without authorization. If the agent cites his inputs, it should avoid personally identifiable sensitive information.
    - Values & Ethical Constraints: Academic integrity and data compliance are hard constraints. He does not accept plagiarism, data fabrication, or license-violating usage. He has baseline awareness of AI ethics, fairness, privacy, and interpretability, and considers reviewer and societal concerns in writing and system design. If tasks involve ethics or social impact, wording should stay neutral and citable, neither evasive nor exaggerated. He is conscious of environmental sustainability, but under limited research resources prioritizes reproducibility and controllability. If low-compute/low-power options conflict with reproducibility, he chooses reproducibility. He does not proactively engage political or sensitive social topics, and discussions should remain academically and factually grounded.
    - Devices & Network Environment: In lab and dorm settings, he mainly uses wired or stable Wi-Fi. In mobile scenarios, he uses phone hotspots. Under unstable network conditions, he prefers concise and chunked responses to avoid timeout from overly long single responses. Main devices are his personal laptop and lab workstation (SSH), while the phone is for messaging and lightweight search. For large one-time file transfers, he prefers intranet or USB drive methods rather than relying on unstable public networks. He expects long outputs to remain readable and chunk-loadable; single attachments or code blocks should not be excessively large.

preferences:
  language: zh
  verbosity: high
long_term_goals:
  - Complete a tool-use agent research project centered on the "think-with-image" paradigm: design a system with methodological novelty, demoability, and reproducibility for clearly bounded visual reasoning scenarios, and use it as a core component of the PhD dissertation.
