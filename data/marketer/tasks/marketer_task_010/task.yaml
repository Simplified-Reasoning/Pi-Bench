    - gmail__send_email_from_draft:
        call: [name]
        result: []
    - gmail__search_users:
        call: [query]
        result: []
  checklist:
    - criterion: "The recommended album should be 'Echoes of Eternity'."
    - criterion: "The email explicitly mentions that the recommended items are high-quality or high rate."
    - criterion: "The email explicitly mentions that the recommended items are helpful for sleep or relaxation."
