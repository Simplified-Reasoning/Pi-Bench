user_id: marketer
role: |

  - 1. Role Type & User Background: Role: AI Agent Evaluation Architect and Senior New Media Operations Specialist. Background: A young female professional living in a Tier 1 city, possessing over a decade of frontline experience in cutting edge new media operations, global market expansion, and crisis public relations. Real world portfolio includes guiding Chinese micro short dramas overseas, executing high ticket B2B AI course community launches, orchestrating hyper niche subculture marketing for direct to consumer brands, managing emergency server crash public relations for smart hardware companies like MeowConnect, and designing complex cross brand campaigns like ROG and Beijing Tong Ren Tang or Apple and Issey Miyake. Currently leveraging this high pressure, practical marketing expertise to architect highly complex, long horizon evaluation datasets for autonomous AI agents.
  - 2. Seniority: Operates at an executive strategic level as a core team member transitioning to a master operator, effortlessly blending advanced consulting frameworks with rigorous LLM evaluation methodologies. Exhibits absolute zero tolerance for agency fluff, vague marketing buzzwords like synergy or fusion, or untestable vanity metrics. Demands extreme information density, granular KPI alignment, and airtight logical bridging across multi step workflows, easily distinguishing between generic proposals and deep, actionable strategies that genuinely integrate product advantages.
  - 3. Interaction Preferences: Language Style: Demands highly professional, precise, direct, and structurally rigorous English suitable for global agency outputs, heavily utilizing actionable constraints and imperative verbs. Proactiveness: Appreciates when the AI automatically utilizes appropriate toolchains like searching emails or adding items to a cart seamlessly, but absolutely forbids unauthorized actions such as outputting fake terminal commands, adding unsolicited advice during wind down hours, or appending fluffy explanations to concise slogans. Verbosity: Possesses an extreme format cleanliness obsession, requiring outputs to strictly adhere to paragraph limits and completely rejecting any conversational filler, greeting paragraphs, concluding summaries, or unnecessary markdown formatting.
  - 4. Workflow Preferences: Planning Horizon: Focuses on a dual polarized workflow, managing highly complex multi document cross cycle syntheses during the day such as using knowledge bases to generate campaign outlines, while demanding rigidly strict, minute by minute time blocked routines at night for personal recovery. Automation Appetite: Extremely high, seeking to delegate her complex cross platform digital life including Todoist task breakdown, Spotify sleep music curation, Amazon high quality supply purchases, and Gmail colleague communication entirely to autonomous agents, demanding precise API granularity like strictly distinguishing between tasks and sub tasks without creating unauthorized projects.
  - 5. Skill & Tool Preferences: Preferred Skill Stack: Combines elite brand strategy, acute consumer electronics and subculture insights, and crisis PR communication skills with advanced prompt engineering, YAML schema logic dataset structuring, and strict automated evaluation criteria formulation. Tool Familiarity: Deeply embedded in a modern digital nomad and elite professional tech stack, utilizing Todoist for rigorous schedule control, Spotify for mood and sleep regulation, Amazon for quality of life procurement, and Gmail for workplace networking. Ecosystem Bias: Highly focused on high cohesion closed loop operations, requiring the agent to explicitly echo and report execution results upon completion for verification, while maintaining a zero tolerance policy for privacy breaches, strictly demanding that passwords never appear in any generated response or system field.
  - 6. Decision & Tradeoff Preferences: Tradeoff Style: Prioritizes negative constraint adherence and long horizon causal logic synthesis above all else, viewing these as the ultimate dividing lines between elite agents and generic text generators. Risk Tolerance: Exhibits absolutely zero tolerance for logical gaps, hallucinations, or formatting loss. Novelty Bias: Drawn to cutting edge, niche, and cross boundary cultural collisions like esports meeting traditional Chinese medicine or tech meeting luxury fashion, while concurrently battling typical Tier 1 city digital laborer anxieties, specifically severe lower back pain from prolonged sitting and acute insomnia induced by high stress.
  - 7. Output Preferences: Demands outputs formatted as ready to use final deliverables, whether that means text ready to be saved directly, emails drafted and ready to be sent, or tasks accurately populated in Todoist. Expects all evaluation test cases to feature hidden intents written strictly from a first person user perspective or as objective factual anchors, accompanied by checklists that are purely one directional, binary, unambiguous, and perfectly formatted for automated evaluator extraction without any subjective interpretation required.
  - 8. Personal / Contextual Preferences: Time Sensitivity: Exists in a state of extreme time scarcity mixed with a desperate need for personal control, requiring the agent to act as a precision scalpel to carve out strictly uninterrupted nervous system recovery time blocks after chaotic weeks of PR crises and product launches. Familiarity Bias: Strongly prefers high quality, tangible products that solve real physiological or psychological pain points, such as Steelcase ergonomic chairs, JBL high fidelity speakers, and functional co branded peripherals. Reliability Preference: Extremely high, requiring the agent to perform like a top tier 4A agency senior account director who never leaks secrets, never misses constraints, deeply understands business logic, and executes exactly as instructed.
  - 9. Goal: Primary Objective: In reality, to utilize elite working capabilities and autonomous agent tools to navigate the high pressure Tier 1 city new media workplace while fiercely defending her fragile personal health and lifestyle boundaries; in the evaluation architecture realm, to construct an ultimate benchmark dataset so ruthlessly difficult that it annihilates generic AI models, allowing only top tier agents capable of strict format adherence, complex tool chaining, and deep logical synthesis to pass. Key Weights: Negative constraint adherence at forty percent, cross document logic synthesis and business depth at thirty percent, and tool precision combined with privacy security at thirty percent.
